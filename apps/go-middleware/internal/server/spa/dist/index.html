<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Estudio</title>
    <style>
      /*
       * The app's design tokens. The pages consume `--text-normal`,
       * `--background-secondary` and the rest, so these are the only place the
       * palette is defined; a page never hard-codes a colour.
       */
      :root {
        --text-normal: #222;
        --text-muted: #666;
        --text-accent: #7b6cd9;
        --text-error: #d64545;
        /*
         * The grade row's fills. They were literals inside `flashcard-session`
         * until backlog D3: a colour written in a component cannot be retuned by
         * the dark block below, so the row was the only surface in the app that
         * ignored `prefers-color-scheme`.
         */
        --text-warning: #e67e22;
        --text-success: #27ae60;
        --text-info: #2980b9;
        --background-primary: #fff;
        --background-secondary: #f5f5f5;
        --background-modifier-border: #ddd;
        --background-modifier-hover: #eee;
        --interactive-accent: #7b6cd9;
        /* Text on an accent or error fill. A ref, not a value: it follows
           `--background-primary` through the dark flip (D4). */
        --text-on-accent: var(--background-primary);
        --font-text: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --text-normal: #dcddde;
          --text-muted: #999;
          --text-accent: #a29bfe;
          --text-error: #ff6b6b;
          /* Lighter fills, because the text on them is dark in this scheme. */
          --text-warning: #f5a623;
          --text-success: #3ddc84;
          --text-info: #4aa3e0;
          --background-primary: #1e1e1e;
          --background-secondary: #2a2a2a;
          --background-modifier-border: #444;
          --background-modifier-hover: #333;
          --interactive-accent: #a29bfe;
        }
      }

      /*
       * The universal reset lives in `src/app/styles.css` inside `@layer base`,
       * not here. Unlayered CSS outranks every layer, so a `* { padding: 0 }`
       * written here silently defeats every Tailwind utility — `px-4` was in the
       * bundle and had no effect, which is how the first migrated button ended up
       * with its label jammed against the edge. The palette stays here: this file
       * is still the only place a colour value is written.
       */

      html,
      body,
      #app {
        height: 100%;
        font-family: var(--font-text);
        background: var(--background-primary);
        color: var(--text-normal);
      }
    </style>

    <link rel="stylesheet" crossorigin href="/assets/index-Dncz5Mct.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
