<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Estudio</title>
    <style>
      /*
       * The app's design tokens. The pages consume `--text-normal`,
       * `--background-secondary` and the rest, so these are the only place the
       * palette is defined; a page never hard-codes a colour.
       */
      :root {
        --text-normal: #222;
        --text-muted: #666;
        --text-accent: #7b6cd9;
        --text-error: #d64545;
        --background-primary: #fff;
        --background-secondary: #f5f5f5;
        --background-modifier-border: #ddd;
        --background-modifier-hover: #eee;
        --interactive-accent: #7b6cd9;
        --font-text: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --text-normal: #dcddde;
          --text-muted: #999;
          --text-accent: #a29bfe;
          --text-error: #ff6b6b;
          --background-primary: #1e1e1e;
          --background-secondary: #2a2a2a;
          --background-modifier-border: #444;
          --background-modifier-hover: #333;
          --interactive-accent: #a29bfe;
        }
      }

      /*
       * The universal reset lives in `src/app/styles.css` inside `@layer base`,
       * not here. Unlayered CSS outranks every layer, so a `* { padding: 0 }`
       * written here silently defeats every Tailwind utility — `px-4` was in the
       * bundle and had no effect, which is how the first migrated button ended up
       * with its label jammed against the edge. The palette stays here: this file
       * is still the only place a colour value is written.
       */

      html,
      body,
      #app {
        height: 100%;
        font-family: var(--font-text);
        background: var(--background-primary);
        color: var(--text-normal);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
